name: Pages

# Builds the StackBlitz example (a small self-contained demo installing the published npm
# package) and deploys it to GitHub Pages.
#   https://inandusolutions.github.io/inandu-grid-react/ -> the live demo
#
# Pages "Source" must be set to "GitHub Actions" (not "Deploy from a branch").

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: examples/stackblitz/package-lock.json

      - name: Install the demo's dependencies
        working-directory: examples/stackblitz
        run: npm ci

      - name: Build the demo
        working-directory: examples/stackblitz
        run: npx vite build --base=/inandu-grid-react/

      - name: Assemble the site
        run: |
          mkdir _site
          cp -r examples/stackblitz/dist/. _site/
          cp _site/index.html _site/404.html   # SPA fallback

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
